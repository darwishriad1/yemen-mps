<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="نظام حماية وتتبع وتسجيل الهواتف - الجمهورية اليمنية" />
  <title>نظام حماية وتتبع الهواتف | الجمهورية اليمنية</title>

  <!-- PWA / Favicon placeholder -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a1f44'/%3E%3Cpath d='M22 16h20a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4V20a4 4 0 0 1 4-4z' fill='none' stroke='%23d4af37' stroke-width='2.5'/%3E%3Ccircle cx='32' cy='44' r='1.5' fill='%23d4af37'/%3E%3C/svg%3E" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

  <!-- ============== TOP APP BAR ============== -->
  <header class="appbar" id="appbar">
    <div class="appbar__inner">
      <button class="iconbtn appbar__menu" id="btnMenu" aria-label="القائمة">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <a href="#/dashboard" class="appbar__brand">
        <div class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M11 8h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" fill="none" stroke="#0a1f44" stroke-width="1.5"/><circle cx="16" cy="22" r="0.8" fill="#0a1f44"/></svg>
        </div>
        <div class="brand__txt">
          <span class="brand__title">نظام حماية الهواتف</span>
          <span class="brand__sub">الجمهورية اليمنية</span>
        </div>
      </a>

      <div class="appbar__actions">
        <button class="iconbtn" id="btnAlerts" aria-label="التنبيهات" title="التنبيهات">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
          <span class="badge-dot" id="alertsDot" hidden></span>
        </button>
        <div class="userchip" id="userChip" hidden>
          <span class="userchip__avatar" id="userAvatar">؟</span>
          <span class="userchip__name" id="userName">—</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ============== SIDE NAV ============== -->
  <aside class="sidenav" id="sidenav" aria-label="القائمة الجانبية">
    <nav class="sidenav__nav" id="sidenavNav">
      <!-- populated by js/router.js based on role -->
    </nav>
    <div class="sidenav__foot">
      <span class="muted small">Asia/Aden · YER · DD/MM/YYYY</span>
    </div>
  </aside>
  <div class="backdrop" id="backdrop" hidden></div>

  <!-- ============== MAIN ROUTER OUTLET ============== -->
  <main class="main" id="main">
    <!-- Page views rendered here -->
  </main>

  <!-- ============== TOAST CONTAINER ============== -->
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <!-- ============== CONFIRM MODAL ============== -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true">
      <div class="modal__head">
        <h3 class="modal__title" id="modalTitle">تأكيد</h3>
        <button class="iconbtn" data-modal-close aria-label="إغلاق">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal__body" id="modalBody">...</div>
      <div class="modal__foot" id="modalFoot">
        <button class="btn btn--ghost" data-modal-close>إلغاء</button>
        <button class="btn btn--primary" id="modalConfirm">تأكيد</button>
      </div>
    </div>
  </div>

  <!-- ============== FOOTER (desktop only) ============== -->
  <footer class="appfoot">
    <span>© الجمهورية اليمنية — منظومة حماية الأجهزة المحمولة</span>
  </footer>

  <!-- ============== SCRIPTS ============== -->
  <!-- Inline bootstrap (immediate, no modules) -->
  <script>
    // Emergency inline bootstrap — يضمن عرض Login على الأقل
    (function() {
      const main = document.getElementById('main');
      const appbar = document.getElementById('appbar');
      if (appbar) appbar.style.display = 'none';
      const sidenav = document.getElementById('sidenav');
      if (sidenav) sidenav.style.display = 'none';
      if (main) {
        main.style.marginInlineStart = '0';
        main.innerHTML = `
          <div class="auth-wrap">
            <div class="auth-card" style="text-align:center">
              <div class="auth-illu"></div>
              <div class="auth-card__brand">
                <div class="brand__mark" style="color:#d4af37;font-size:48px">🛡️</div>
                <h1>نظام حماية وتتبع الهواتف</h1>
                <p>الجمهورية اليمنية</p>
              </div>
              <div style="padding:20px">
                <div class="spinner" style="width:32px;height:32px;border-width:3px"></div>
                <p style="margin-top:12px;color:#94a3b8">جاري تحميل النظام...</p>
              </div>
            </div>
          </div>
        `;
      }
    })();
  </script>

  <!-- Main app as a single module entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
